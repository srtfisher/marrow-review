name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two toolchains on purpose: bun runs the suite (tests import `bun:test`),
      # npm does the publishing (OIDC trusted publishing is an npm feature).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      # Before anything expensive: a tag that disagrees with package.json would
      # otherwise publish a version nobody asked for under a tag that says
      # something else.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tagged, package.json says $declared"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
        id: version

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint:boundary
      - run: bun run build

      # No token needed: OIDC authenticates via the trusted publisher configured
      # on npmjs.com, and provenance is generated automatically.
      #
      # Publishing is the one step here that cannot be repeated, so it asks first:
      # a tag applied retroactively, or a re-run of a release whose later steps
      # failed, must not fail the whole run on a version that is already up.
      - name: Publish to npm
        run: |
          version="${{ steps.version.outputs.version }}"
          if npm view "marrow-review@${version}" version >/dev/null 2>&1; then
            echo "marrow-review@${version} is already on the registry; skipping publish."
          else
            npm publish
          fi

      - name: Extract changelog notes for this version
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ && flag { flag = 0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "marrow $version" \
            --notes-file RELEASE_NOTES.md

  # The Mac app rides along on the same release. No Developer ID, so it is
  # ad-hoc signed and not notarized; the README says how to open it.
  desktop:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: bun test
        working-directory: desktop

      # One runner builds both: Electron downloads per arch, and with the SDK's
      # native Claude Code stripped out, nothing else marrow ships is native.
      - run: scripts/package.sh arm64 && scripts/package.sh x64
        working-directory: desktop

      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/out/*.zip --clobber

      # github.token cannot push to another repository, hence a write deploy key
      # on the tap, whose private half is this secret.
      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm=$(shasum -a 256 "desktop/out/marrow-$version-mac-arm64.zip" | cut -d' ' -f1)
          intel=$(shasum -a 256 "desktop/out/marrow-$version-mac-x64.zip" | cut -d' ' -f1)
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:srtfisher/homebrew-marrow.git tap
          perl -0pi -e "s/version \"[^\"]+\"/version \"$version\"/; s/arm:(\s+)\"[0-9a-f]{64}\"/arm:\$1\"$arm\"/; s/intel:(\s+)\"[0-9a-f]{64}\"/intel:\$1\"$intel\"/" tap/Casks/marrow.rb
          cd tap
          # A re-run of a release that already updated the tap has nothing to commit.
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "marrow $version"
          git push
